<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clubes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <main class="max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <div class="px-6 py-5 bg-slate-900 text-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-500/20 text-blue-400 rounded-xl">
                    <i data-lucide="building-2" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 id="formTitle" class="text-xl font-bold tracking-tight">Cadastrar Clube</h1>
                    <p class="text-xs text-slate-400">Configure as porcentagens de split e cortesia do clube</p>
                </div>
            </div>
            <a href="/listas/list_clubs.html" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg transition-colors">
                <i data-lucide="list" class="w-4 h-4"></i>
                Ver Tabela
            </a>
        </div>

        <div class="p-6 md:p-8 space-y-8">
            
            <!-- Formulário -->
            <form id="clubForm" class="space-y-5">
                <input type="hidden" id="editingId" value="" />
                
                <!-- Nome do Clube -->
                <div>
                    <label for="nameClubInput" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                        Nome do Clube
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="building" class="w-5 h-5"></i>
                        </div>
                        <input type="text" id="nameClubInput" placeholder="Ex: Club Med / Green Valley" required
                            class="block w-full pl-11 pr-4 py-3 bg-slate-50 border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all">
                    </div>
                </div>

                <!-- Grid com Split A&B e Split Ing. -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Split A&B (%) -->
                    <div>
                        <label for="splitAbInput" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                            Split A&B (%)
                        </label>
                        <div class="relative rounded-xl shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="percent" class="w-4 h-4"></i>
                            </div>
                            <input type="number" step="0.01" min="0" max="100" id="splitAbInput" placeholder="0.00" required
                                class="block w-full pl-10 pr-4 py-3 bg-slate-50 border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all">
                        </div>
                    </div>

                    <!-- Split Ing. (%) -->
                    <div>
                        <label for="splitIngInput" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                            Split Ing. (%)
                        </label>
                        <div class="relative rounded-xl shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="ticket" class="w-4 h-4"></i>
                            </div>
                            <input type="number" step="0.01" min="0" max="100" id="splitIngInput" placeholder="0.00" required
                                class="block w-full pl-10 pr-4 py-3 bg-slate-50 border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all">
                        </div>
                    </div>
                </div>

                <!-- Valor Cortesia (R$) -->
                <div>
                    <label for="valorCortesiaInput" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">
                        Valor Cortesia (R$)
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <span class="text-sm font-semibold text-slate-400">R$</span>
                        </div>
                        <input type="number" step="0.01" min="0" id="valorCortesiaInput" placeholder="0.00" required
                            class="block w-full pl-11 pr-4 py-3 bg-slate-50 border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all">
                    </div>
                </div>

                <div class="flex items-center gap-3 pt-3">
                    <button type="submit" id="submitBtn" 
                        class="flex-1 inline-flex justify-center items-center gap-2 px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 transition-all">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Adicionar Clube</span>
                    </button>
                    
                    <button type="button" id="cancelBtn" onclick="window.location.href='/listas/list_clubs.html'" style="display:none;"
                        class="inline-flex justify-center items-center gap-2 px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-semibold rounded-xl transition-all">
                        <i data-lucide="x" class="w-4 h-4"></i>
                        <span>Cancelar</span>
                    </button>
                </div>
            </form>
    </main>

    <!-- Inclusão do Menu Lateral -->
<script src="/cadastros/sidebar.js"></script>

<script>
    const API_URL = '/api/clubs';

    lucide.createIcons();
    loadClubs();

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');

        if (editId) {
            fetch(API_URL)
                .then(res => res.json())
                .then(clubs => {
                    const club = clubs.find(c => c.id == editId);
                    if (club) {
                        startEdit(club.id, club.name_club, club.split_ab, club.split_ing, club.valor_cortesia);
                    }
                })
                .catch(err => console.error('Erro ao buscar dados:', err));
        }
    });

    async function loadClubs() {
        try {
            const response = await fetch(API_URL);
            const clubs = await response.json();

            const list = document.getElementById('clubList');
            list.innerHTML = '';

            if (clubs.length === 0) {
                list.innerHTML = `
                    <li class="text-center py-6 text-slate-400 text-sm italic border border-dashed border-slate-200 rounded-xl">
                        Nenhum clube cadastrado no momento.
                    </li>`;
                return;
            }

            clubs.forEach(club => {
                const li = document.createElement('li');
                li.className = 'flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100/80 border border-slate-200/60 rounded-xl transition-colors';
                li.innerHTML = `
                    <div class="flex flex-col gap-1">
                        <span class="font-bold text-slate-800 text-sm">${escapeHtml(club.name_club)}</span>
                        <div class="flex items-center gap-3 text-xs text-slate-500">
                            <span>A&B: <strong class="text-slate-700">${parseFloat(club.split_ab)}%</strong></span>
                            <span>•</span>
                            <span>Ing.: <strong class="text-slate-700">${parseFloat(club.split_ing)}%</strong></span>
                            <span>•</span>
                            <span>Cortesia: <strong class="text-emerald-600">R$ ${parseFloat(club.valor_cortesia).toFixed(2)}</strong></span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar" onclick="startEdit(${club.id}, '${club.name_club.replace(/'/g, "\\'")}', ${club.split_ab}, ${club.split_ing},${club.valor_cortesia})">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir" onclick="deleteClub(${club.id})">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                list.appendChild(li);
            });

            lucide.createIcons();
        } catch (error) {
            console.error('Erro ao carregar clubes:', error);
        }
    }

    document.getElementById('clubForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const id = document.getElementById('editingId').value;
        const name_club = document.getElementById('nameClubInput').value.trim();
        const split_ab = parseFloat(document.getElementById('splitAbInput').value) || 0;
        const split_ing = parseFloat(document.getElementById('splitIngInput').value) || 0;
        const valor_cortesia = parseFloat(document.getElementById('valorCortesiaInput').value) || 0;

        if (!name_club) return;

        try {
            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name_club, split_ab, split_ing, valor_cortesia })
            });

            if (response.ok) {
                window.location.href = '/listas/list_clubs.html';
            } else {
                const errorData = await response.json();
                alert('Erro ao salvar clube: ' + (errorData.error || 'Tente novamente.'));
            }
        } catch (error) {
            console.error('Erro ao salvar clube:', error);
            alert('Erro de conexão com o servidor.');
        }
    });

    function startEdit(id, name, splitAb, splitIng, cortesia) {
        document.getElementById('editingId').value = id;
        document.getElementById('nameClubInput').value = name;
        document.getElementById('splitAbInput').value = splitAb;
        document.getElementById('splitIngInput').value = splitIng;
        document.getElementById('valorCortesiaInput').value = cortesia;

        document.getElementById('formTitle').innerText = 'Editar Clube';
        document.getElementById('submitBtn').innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>Salvar Alterações</span>`;
        document.getElementById('cancelBtn').style.display = 'inline-flex';
        
        lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editingId').value = '';
        document.getElementById('nameClubInput').value = '';
        document.getElementById('splitAbInput').value = '';
        document.getElementById('splitIngInput').value = '';
        document.getElementById('valorCortesiaInput').value = '';

        document.getElementById('formTitle').innerText = 'Cadastrar Clube';
        document.getElementById('submitBtn').innerHTML = `<i data-lucide="plus-circle" class="w-4 h-4"></i><span>Adicionar Clube</span>`;
        document.getElementById('cancelBtn').style.display = 'none';

        lucide.createIcons();
    }

    async function deleteClub(id) {
        if (!confirm('Deseja realmente excluir este clube?')) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadClubs();
            } else {
                alert('Erro ao excluir clube.');
            }
        } catch (error) {
            console.error('Erro ao deletar clube:', error);
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
