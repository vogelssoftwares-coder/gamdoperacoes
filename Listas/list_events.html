<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Eventos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <main class="max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <div class="px-6 py-5 bg-slate-900 text-white flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-500/20 text-blue-400 rounded-xl">
                    <i data-lucide="calendar" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Gestão de Eventos</h1>
                    <p class="text-xs text-slate-400">Listagem completa de eventos, clubes e plantonistas</p>
                </div>
            </div>
            
            <a href="/cadastros/cd_events.html" 
                class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition-all">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Novo Evento</span>
            </a>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            
            <!-- Campo de Busca -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Buscar por evento ou clube..." oninput="filterEvents()"
                    class="block w-full pl-10 pr-4 py-3 bg-slate-50 border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" />
            </div>

            <!-- Tabela de Eventos -->
            <div class="overflow-x-auto rounded-xl border border-slate-200/80 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 border-b border-slate-200/80 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3.5 px-4">ID</th>
                            <th class="py-3.5 px-4">Evento</th>
                            <th class="py-3.5 px-4">Clube</th>
                            <th class="py-3.5 px-4">Plantonista</th>
                            <th class="py-3.5 px-4">Data / Hora</th>
                            <th class="py-3.5 px-4">Início das Vendas</th>
                            <th class="py-3.5 px-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Dados dinâmicos via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>

<!-- Inclusão do Menu Lateral -->
<script src="/cadastros/sidebar.js"></script>

<script>
    const API_URL = '/api/events';
    let allEvents = [];

    // Carregar lista ao abrir
    loadEvents();

    async function loadEvents() {
        try {
            const response = await fetch(API_URL);
            allEvents = await response.json();
            renderTable(allEvents);
        } catch (error) {
            console.error('Erro ao carregar lista de eventos:', error);
        }
    }

    function renderTable(eventsList) {
        const tbody = document.getElementById('eventsTableBody');
        tbody.innerHTML = '';

        if (eventsList.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center py-10 text-slate-400 italic">
                        <div class="flex flex-col items-center justify-center gap-2">
                            <i data-lucide="calendar-x" class="w-8 h-8 text-slate-300"></i>
                            <span>Nenhum evento encontrado.</span>
                        </div>
                    </td>
                </tr>`;
            lucide.createIcons();
            return;
        }

        eventsList.forEach(event => {
            // Formatar Data do Evento
            const eventDateFormatted = new Date(event.event_date).toLocaleDateString('pt-BR', { timeZone: 'UTC' });
            
            // Formatar Hora do Evento
            const eventTimeFormatted = event.event_time ? event.event_time.slice(0, 5) : '-';

            // Formatar Data/Hora do Início das Vendas
            const salesStartFormatted = event.sales_start_date
                ? new Date(event.sales_start_date).toLocaleDateString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                  })
                : '-';

            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50/80 transition-colors';
            tr.innerHTML = `
                <td class="py-3.5 px-4 font-mono font-medium text-slate-400">#${event.id}</td>
                <td class="py-3.5 px-4 font-bold text-slate-800">
                    <div>${escapeHtml(event.event_name)}</div>
                    <span class="text-xs font-normal text-slate-400">${escapeHtml(event.month)}</span>
                </td>
                <td class="py-3.5 px-4 text-slate-700 font-medium">
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="building-2" class="w-4 h-4 text-slate-400 shrink-0"></i>
                        <span>${escapeHtml(event.name_club)}</span>
                    </div>
                </td>
                <td class="py-3.5 px-4">
                    <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-slate-100 border border-slate-200/60 rounded-lg">
                        <span class="w-3 h-3 rounded-full border border-black/10 shadow-sm shrink-0" style="background-color: ${event.staff_color || '#3b82f6'}"></span>
                        <span class="text-xs text-slate-700 font-medium">${escapeHtml(event.staff_name)}</span>
                    </div>
                </td>
                <td class="py-3.5 px-4 text-slate-600 text-xs font-medium">
                    <div>${eventDateFormatted}</div>
                    <div class="text-slate-400">${eventTimeFormatted}</div>
                </td>
                <td class="py-3.5 px-4 text-xs font-semibold text-emerald-600">
                    ${salesStartFormatted}
                </td>
                <td class="py-3.5 px-4 text-right">
                    <div class="flex items-center justify-end gap-1">
                        <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar" onclick="editEvent(${event.id})">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir" onclick="deleteEvent(${event.id})">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        lucide.createIcons();
    }

    function filterEvents() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allEvents.filter(item => 
            item.event_name.toLowerCase().includes(term) || 
            item.name_club.toLowerCase().includes(term)
        );
        renderTable(filtered);
    }

    function editEvent(id) {
        window.location.href = `/cadastros/cd_events.html?id=${id}`;
    }

    async function deleteEvent(id) {
        if (!confirm('Tem certeza que deseja excluir este evento?')) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadEvents();
            } else {
                alert('Erro ao excluir evento.');
            }
        } catch (error) {
            console.error('Erro ao deletar evento:', error);
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
