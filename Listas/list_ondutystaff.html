<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista da Equipe de Plantão</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">

    <main class="max-w-6xl mx-auto">
        
        <!-- Cabeçalho -->
        <div class="px-6 py-5 bg-slate-900 text-white flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-500/20 text-blue-400 rounded-xl">
                    <i data-lucide="users" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Equipe de Plantão</h1>
                    <p class="text-xs text-slate-400">Listagem e gestão de membros cadastrados</p>
                </div>
            </div>
            
            <a href="/cadastros/cd_ondutystaff.html" 
                class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition-all">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Novo Plantonista</span>
            </a>
        </div>

        <div class="p-6 md:p-8 space-y-6">
            
            <!-- Campo de Busca -->
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="search" class="w-4 h-4"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Buscar por nome..." oninput="filterStaff()"
                    class="block w-full pl-10 pr-4 py-3 bg-slate-50 border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all" />
            </div>

            <!-- Tabela de Plantonistas -->
            <div class="overflow-x-auto rounded-xl border border-slate-200/80 shadow-sm">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/80 border-b border-slate-200/80 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                            <th class="py-3.5 px-4">ID</th>
                            <th class="py-3.5 px-4">Nome</th>
                            <th class="py-3.5 px-4">Cor</th>
                            <th class="py-3.5 px-4">Data de Criação</th>
                            <th class="py-3.5 px-4 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Dados dinâmicos via JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>

<!-- Inclusão do Menu Lateral -->
<script src="/cadastros/sidebar.js"></script>

<script>
    const API_URL = '/api/ondutystaff';
    let allStaff = [];

    // Carregar lista ao abrir
    loadStaff();

    async function loadStaff() {
        try {
            const response = await fetch(API_URL);
            allStaff = await response.json();
            renderTable(allStaff);
        } catch (error) {
            console.error('Erro ao carregar lista de plantonistas:', error);
        }
    }

    function renderTable(staffList) {
        const tbody = document.getElementById('staffTableBody');
        tbody.innerHTML = '';

        if (staffList.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-10 text-slate-400 italic">
                        <div class="flex flex-col items-center justify-center gap-2">
                            <i data-lucide="user-x" class="w-8 h-8 text-slate-300"></i>
                            <span>Nenhum plantonista encontrado.</span>
                        </div>
                    </td>
                </tr>`;
            lucide.createIcons();
            return;
        }

        staffList.forEach(member => {
            const createdDate = member.created_in 
                ? new Date(member.created_in).toLocaleDateString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                  })
                : '-';

            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50/80 transition-colors';
            tr.innerHTML = `
                <td class="py-3.5 px-4 font-mono font-medium text-slate-400">#${member.id}</td>
                <td class="py-3.5 px-4 font-medium text-slate-800">${escapeHtml(member.name)}</td>
                <td class="py-3.5 px-4">
                    <div class="inline-flex items-center gap-2 px-2.5 py-1 bg-slate-100 border border-slate-200/60 rounded-lg">
                        <span class="w-3.5 h-3.5 rounded-full border border-black/10 shadow-sm shrink-0" style="background-color: ${member.color}"></span>
                        <span class="font-mono text-xs text-slate-600 font-semibold uppercase">${member.color}</span>
                    </div>
                </td>
                <td class="py-3.5 px-4 text-slate-500 text-xs">${createdDate}</td>
                <td class="py-3.5 px-4 text-right">
                    <div class="flex items-center justify-end gap-1">
                        <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar" onclick="editStaff(${member.id})">
                            <i data-lucide="pencil" class="w-4 h-4"></i>
                        </button>
                        <button class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir" onclick="deleteStaff(${member.id})">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        lucide.createIcons();
    }

    function filterStaff() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allStaff.filter(item => item.name.toLowerCase().includes(term));
        renderTable(filtered);
    }

    function editStaff(id) {
        window.location.href = `/cadastros/cd_ondutystaff.html?id=${id}`;
    }

    async function deleteStaff(id) {
        if (!confirm('Tem certeza que deseja excluir este plantonista?')) return;

        try {
            const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (response.ok) {
                loadStaff();
            } else {
                alert('Erro ao excluir plantonista.');
            }
        } catch (error) {
            console.error('Erro ao deletar:', error);
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
